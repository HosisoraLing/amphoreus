# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/009-amphoreus.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-amphoreus
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/amphoreus>
    configPath: <absolute path to your private amphoreus.json>
